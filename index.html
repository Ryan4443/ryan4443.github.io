
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 10 Pro Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
            --gold: #fbbf24;
            --silver: #cbd5e1;
            --bronze: #b45309;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 800px) {
            .container { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h2 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 5px;
        }

        /* --- Input & Button Styles --- */
        input[type="text"], input[type="number"], input[type="password"], textarea {
            width: 100%;
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 8px;
            outline: none;
            transition: 0.2s;
        }
        
        input:focus, textarea:focus { border-color: var(--accent); }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background: var(--accent-hover); }

        /* --- Leaderboard Styles --- */
        .rank-entry-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .pin-container { grid-column: span 2; }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .rank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-main);
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: 0.2s;
        }

        .rank-item:hover { border-color: var(--text-muted); }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 800; }
        .badge-gold { background: rgba(251, 191, 36, 0.2); color: var(--gold); }
        .badge-silver { background: rgba(203, 213, 225, 0.2); color: var(--silver); }
        .badge-bronze { background: rgba(180, 83, 9, 0.2); color: var(--bronze); }
        .badge-standard { background: var(--border); color: var(--text-muted); }

        /* --- Syllabus Tracker Styles --- */
        .syllabus-container {
            max-height: 700px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .subject-group { margin-bottom: 20px; }
        .subject-title { font-weight: 800; color: var(--text-main); margin-bottom: 10px; font-size: 1.1rem; }
        
        .chapter-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            padding: 8px;
            background: var(--bg-main);
            border-radius: 6px;
            cursor: pointer;
        }

        .chapter-item:hover { background: var(--border); }
        .chapter-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent); }
        .chapter-label { font-size: 0.9rem; color: var(--text-muted); user-select: none; }
        .chapter-item input[type="checkbox"]:checked + .chapter-label { text-decoration: line-through; color: var(--border); }

        /* --- Scratchpad --- */
        #scratchpad-area {
            resize: vertical;
            min-height: 150px;
            font-family: monospace;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="panel">
            <h2>Class 10 Syllabus Tracker</h2>
            <div id="syllabus-container" class="syllabus-container">
                </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 20px;">
            
            <div class="panel">
                <h2>Live Leaderboard</h2>
                
                <div class="rank-entry-form">
                    <input type="text" id="rank-student-name" placeholder="Student Name">
                    <input type="number" id="rank-student-marks" placeholder="Marks">
                    <div class="pin-container">
                        <input type="password" id="rank-auth-pin" placeholder="Teacher Auth PIN">
                    </div>
                    <button style="grid-column: span 2;" onclick="commitGradeEntry()">Push to Cloud</button>
                </div>

                <div id="leaderboard-container" class="leaderboard-list">
                    <div style="text-align:center; color:var(--text-muted); padding:15px;">Loading live data...</div>
                </div>
            </div>

            <div class="panel">
                <h2>Global Scratchpad</h2>
                <textarea id="scratchpad-area" placeholder="Type notes here... Saves automatically." oninput="saveScratchpad()"></textarea>
            </div>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>

    <script>
        /* =========================================
           1. SYLLABUS TRACKER LOGIC
           ========================================= */
        const syllabusData = {
            "Mathematics": [
                "Real Numbers", "Polynomials", "Pair of Linear Equations in Two Variables", 
                "Quadratic Equations", "Arithmetic Progressions", "Triangles", "Coordinate Geometry", 
                "Introduction to Trigonometry", "Some Applications of Trigonometry", "Circles", 
                "Constructions", "Areas Related to Circles", "Surface Areas and Volumes", 
                "Statistics", "Probability"
            ],
            "Science": [
                "Chemical Reactions and Equations", "Acids, Bases and Salts", "Metals and Non-metals", 
                "Carbon and its Compounds", "Periodic Classification of Elements", "Life Processes", 
                "Control and Coordination", "How do Organisms Reproduce?", "Heredity and Evolution", 
                "Light - Reflection and Refraction", "Human Eye and Colourful World", "Electricity", 
                "Magnetic Effects of Electric Current", "Sources of Energy", "Our Environment", 
                "Management of Natural Resources"
            ],
            "Social Science": [
                "The Rise of Nationalism in Europe", "Nationalism in India", "The Making of a Global World", 
                "The Age of Industrialisation", "Print Culture and the Modern World", "Resources and Development", 
                "Forest and Wildlife Resources", "Water Resources", "Agriculture", "Minerals and Energy Resources", 
                "Manufacturing Industries", "Lifelines of National Economy", "Power Sharing", "Federalism", 
                "Democracy and Diversity", "Gender, Religion and Caste", "Popular Struggles and Movements", 
                "Political Parties", "Outcomes of Democracy", "Challenges to Democracy", "Development", 
                "Sectors of the Indian Economy", "Money and Credit", "Globalisation and the Indian Economy", 
                "Consumer Rights"
            ]
        };

        function renderSyllabus() {
            const container = document.getElementById('syllabus-container');
            let html = '';

            for (const [subject, chapters] of Object.entries(syllabusData)) {
                html += `<div class="subject-group"><div class="subject-title">${subject}</div>`;
                
                chapters.forEach((chapter, index) => {
                    const chapterId = `chapter-${subject.substring(0,3)}-${index}`;
                    // Retrieve saved state from localStorage
                    const isChecked = localStorage.getItem(chapterId) === 'true' ? 'checked' : '';
                    
                    html += `
                        <label class="chapter-item" for="${chapterId}">
                            <input type="checkbox" id="${chapterId}" ${isChecked} onchange="saveSyllabusProgress('${chapterId}', this.checked)">
                            <span class="chapter-label">${chapter}</span>
                        </label>
                    `;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        function saveSyllabusProgress(id, checked) {
            localStorage.setItem(id, checked);
        }

        /* =========================================
           2. SCRATCHPAD LOGIC
           ========================================= */
        function loadScratchpad() {
            const pad = document.getElementById('scratchpad-area');
            pad.value = localStorage.getItem('portal_global_scratchpad') || "";
        }

        function saveScratchpad() {
            const pad = document.getElementById('scratchpad-area');
            localStorage.setItem('portal_global_scratchpad', pad.value);
        }


        /* =========================================
           3. APPWRITE CLOUD LEADERBOARD LOGIC
           ========================================= */
        const FA_SECURITY_PIN = "1234"; // <-- Change this to your secret PIN

        const { Client, Databases, ID } = Appwrite;
        const client = new Client()
            .setEndpoint('https://cloud.appwrite.io/v1') 
            .setProject('6a21bad3002cb6968d08');

        const databases = new Databases(client);
        const DATABASE_ID = '6a21bbd60013b6cecd39';
        const COLLECTION_ID = 'leaderboard';

        async function syncLiveLeaderboard() {
            try {
                await fetchAndRenderRanks();
                // Listen for LIVE changes
                client.subscribe(`databases.${DATABASE_ID}.collections.${COLLECTION_ID}.documents`, response => {
                    fetchAndRenderRanks();
                });
            } catch (error) {
                console.error("Database connection issue:", error);
            }
        }

        async function fetchAndRenderRanks() {
            const response = await databases.listDocuments(DATABASE_ID, COLLECTION_ID);
            const sortedRoster = response.documents.sort((a, b) => b.marks - a.marks);
            buildLeaderboardUI(sortedRoster);
        }

        async function commitGradeEntry() {
            const name = document.getElementById('rank-student-name').value.trim();
            const marksStr = document.getElementById('rank-student-marks').value.trim();
            const inputPIN = document.getElementById('rank-auth-pin').value.trim();

            if(!name || !marksStr) return alert("Fields cannot be blank.");
            if(inputPIN !== FA_SECURITY_PIN) return alert("Access Aborted: Invalid PIN Verification.");

            try {
                await databases.createDocument(
                    DATABASE_ID, 
                    COLLECTION_ID, 
                    ID.unique(), 
                    { name: name, marks: parseFloat(marksStr) }
                );

                // Clear input boxes
                document.getElementById('rank-student-name').value = "";
                document.getElementById('rank-student-marks').value = "";
                document.getElementById('rank-auth-pin').value = "";
            } catch (err) {
                console.error(err);
                alert("Failed to send data to the cloud. Check console for errors.");
            }
        }

        function buildLeaderboardUI(roster) {
            const container = document.getElementById('leaderboard-container');
            if(!container) return;
            
            if(roster.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:15px;">No active entries detected.</div>`;
                return;
            }

            container.innerHTML = roster.map((student, index) => {
                let badgeClass = "badge-standard"; 
                let statusIcon = `Rank ${index + 1}`;
                
                if(index === 0) { badgeClass = "badge-gold"; statusIcon = "🥇 Rank 1"; }
                else if(index === 1) { badgeClass = "badge-silver"; statusIcon = "🥈 Rank 2"; }
                else if(index === 2) { badgeClass = "badge-bronze"; statusIcon = "🥉 Rank 3"; }

                return `
                    <div class="rank-item">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span class="badge ${badgeClass}">${statusIcon}</span>
                            <span style="font-weight:700;">${student.name}</span>
                        </div>
                        <div style="display:flex; align-items:center;">
                            <span style="font-family:monospace; font-weight:800; color:var(--accent); font-size:1.1rem;">${student.marks} M</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        /* =========================================
           4. INITIALIZE APP
           ========================================= */
        window.onload = function() {
            renderSyllabus();
            loadScratchpad();
            syncLiveLeaderboard();
        };
    </script>
</body>
</html>
